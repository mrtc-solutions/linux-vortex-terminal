name: quality

on:
  push:
  pull_request:

jobs:
  python-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: python3 -m py_compile backend/vortex_backend.py cli/vortex.py
      - name: Unit and negative tests
        run: python3 -m unittest discover -s tests -v
      - name: CLI smoke
        run: |
          VORTEX_DATA_DIR="$RUNNER_TEMP/vortex" ./vortex doctor --json
          VORTEX_DATA_DIR="$RUNNER_TEMP/vortex" ./vortex plan "system health"
      - name: Shell asset syntax
        run: sh -n vortex
  renderer-assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node --check frontend/app.js
      - run: node --check desktop/main.js
      - run: node --check desktop/preload.js
